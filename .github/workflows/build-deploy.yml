name: Build and deploy corp-merch.eu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate build
        run: npm run check

      - name: Test Worker contract
        run: npm run test:worker

      - name: Validate production configuration
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.GA4_MEASUREMENT_ID != ''
        run: npm run check:production

      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.GA4_MEASUREMENT_ID != ''
        run: npx wrangler deploy

      - name: Smoke test production lead delivery
        if: success() && contains(github.event.head_commit.message, '[lead-smoke-test]')
        run: |
          started_at="$(node -e 'console.log(Date.now()-5000)')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST https://corp-merch.eu/api/lead \
            --data-urlencode "name=corp-merch.eu launch test" \
            --data-urlencode "email=order@swaggy.agency" \
            --data-urlencode "company=SWAGGY" \
            --data-urlencode "event=Production smoke test" \
            --data-urlencode "need=Automated one-time delivery test after launch. No action needed." \
            --data-urlencode "consent=on" \
            --data-urlencode "startedAt=$started_at")"
          echo "$response"
          echo "$response" | grep -q '"ok":true'

      - name: Production configuration missing
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.GA4_MEASUREMENT_ID == ''
        run: |
          echo "::warning::Build completed, but deployment was skipped because Cloudflare credentials and/or the dedicated GA4_MEASUREMENT_ID are not configured."
